<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 300 360">
  <!-- 향 피우기 컷신: 남강가에 무릎 꿇고 유등을 띄우며 기도하는 소녀의 역광 실루엣.
       오른쪽(유등·강)에서 빛이 온다. 두 손 위치(약 80%, 55%)에 코드가 유등을 올린다 -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcc441" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fcc441" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fdf6bf" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <!-- 강가 바위 -->
  <path d="M0 360 C18 334 58 338 98 344 C150 336 214 340 264 350 C282 354 294 357 300 360 Z" fill="#06090c"/>
  <g fill="#0a1016" stroke="url(#rim)" stroke-width="2.2" stroke-linejoin="round">
    <!-- 땋은 머리: 뒤통수에서 등 뒤로 -->
    <path d="M174 110 C164 120 160 138 158 160 C156 190 150 214 144 238 L137 236 C143 212 149 188 151 160 C153 136 157 116 169 102 Z"/>
    <!-- 치마: 가슴께에서 퍼져 무릎 꿇은 채 바닥에 고임 -->
    <path d="M150 176 C128 190 108 230 92 280 C80 316 60 340 34 352 L278 352 C258 338 240 316 228 284 C214 240 200 200 188 178 C176 172 160 172 150 176 Z"/>
    <!-- 짧은 저고리 -->
    <path d="M150 178 C146 164 152 150 166 145 C178 142 190 148 193 160 C195 170 193 176 189 180 C174 184 160 184 150 178 Z"/>
    <!-- 앞으로 내민 두 팔 -->
    <path d="M180 150 C200 162 220 178 240 192 L236 200 C216 188 196 174 176 160 Z"/>
    <path d="M174 162 C196 174 216 188 234 200 L230 207 C212 196 192 184 170 172 Z"/>
    <!-- 목과 숙인 머리 -->
    <path d="M170 147 L177 132 L186 135 L182 149 Z"/>
    <ellipse cx="186" cy="118" rx="14.5" ry="17" transform="rotate(20 186 118)"/>
  </g>
  <!-- 고름 -->
  <path d="M186 178 C192 190 198 204 202 218 L196 220 C192 206 186 192 181 181 Z" fill="#3a1520"/>
  <!-- 두 손 -->
  <ellipse cx="238" cy="200" rx="8" ry="5.5" fill="#0a1016" stroke="#fdf6bf" stroke-opacity=".85" stroke-width="1.5"/>
  <!-- 댕기 -->
  <path d="M138 236 L147 239 L146 258 L140 254 L133 260 Z" fill="#5a1a26"/>
</svg>
