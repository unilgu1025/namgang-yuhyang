<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040506" />
  <title>남강유향의 이야기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/comic.css" />
  <style>
    body { background: linear-gradient(var(--ink), var(--night) 60%, var(--ink)); }
    main { max-width: 560px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 4px; text-align: center; font: 700 clamp(28px, 8vw, 38px)/1.3 var(--font-title); color: var(--wick); }
    .sub { margin: 0 0 28px; text-align: center; color: var(--gold); }
    #panels { display: grid; gap: 32px; }
    .panel figcaption { font-size: 19px; }
    .panel q { font-size: 20px; }
    .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 40px; }
    .actions .btn { width: min(320px, 100%); }
  </style>
</head>
<body>
  <main>
    <h1>남강유향의 이야기</h1>
    <p class="sub">강 건너 보내는 안부</p>
    <div id="panels"></div>
    <div class="actions">
      <a class="btn primary" href="index.html">게임 하러 가기</a>
      <a class="btn" href="promo.html">남강유향 알아보기</a>
    </div>
  </main>
  <script type="module">
    import { renderComic } from '/src/comic.ts';
    renderComic(document.getElementById('panels'));
  </script>
  <script type="module" src="/src/bgm.ts"></script>
</body>
</html>
